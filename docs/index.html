<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCEEFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Los-geht's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Los-geht's-Uhr</title>
</head>
<body>
<style>
/* Layout: links eine Zeitleiste von oben (Start) nach unten (Ziel = Zielflagge), rechts die Startzeit mit dem großen Los-Knopf.
   Bewusst nur ein helles, freundliches Farbschema (Kinder-App), alle Farben explizit gesetzt. */
:root {
  --sky: #DCEEFA;
  --sky-deep: #BFDDF2;
  --paper: #FFFFFF;
  --ink: #1E2A47;
  --ink-soft: #5B6B88;
  --sun: #FFC93C;
  --go: #1FA774;
  --go-dark: #15805A;
  --snail: #A9B9C9;
  --road: #4A5468;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky);
  background-image:
    radial-gradient(120px 60px at 12% 8%, rgba(255,255,255,.7), transparent 70%),
    radial-gradient(160px 70px at 85% 4%, rgba(255,255,255,.6), transparent 70%);
  background-attachment: fixed;
  color: var(--ink);
  font: 500 18px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
input, textarea { font: inherit; -webkit-user-select: text; user-select: text; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- Kopf ---------- */
.top { display: flex; align-items: center; gap: 12px; max-width: 1120px; margin: 0 auto; padding-block: 18px 6px; }
.logo { font: 800 30px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo i { font-style: normal; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--sun); box-shadow: 0 4px 0 #E0A818; font-size: 26px; }
.chip-btn { background: var(--paper); border-radius: 999px; padding: 10px 18px; font-weight: 800; box-shadow: 0 4px 0 var(--sky-deep); }
.chip-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }

/* ---------- Planen ---------- */
.plan { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 28px; max-width: 1120px; margin: 0 auto; padding-block: 10px 40px; align-items: start; }
.track { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.add-before { align-self: stretch; margin-left: 86px; border: 3px dashed #8FB8D8; border-radius: 22px; padding: 16px; font: 800 20px/1.2 var(--display); color: var(--ink-soft); background: rgba(255,255,255,.45); }
.add-before:active { background: var(--paper); }
.add-before small { display: block; font: 600 15px var(--body); color: var(--ink-soft); }

.row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: center; }
.when { font: 800 22px/1 var(--display); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.when small { display: block; font: 700 12px var(--body); color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; margin-top: 2px; }
.gap { height: 14px; margin-left: 86px; border-left: 4px dotted #9DC3E0; margin-left: calc(86px + 34px); }

.step { position: relative; background: var(--paper); border-radius: 24px; padding: 14px 14px 20px; display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; align-items: center; box-shadow: 0 5px 0 var(--sky-deep); overflow: hidden; }
.ico { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 36px; background: color-mix(in srgb, var(--c) 22%, white); }
.sname { font: 800 22px/1.15 var(--display); overflow-wrap: anywhere; }
.tools { display: flex; gap: 4px; margin-top: 4px; }
.tool { width: 36px; height: 36px; border-radius: 12px; background: var(--sky); color: var(--ink-soft); font-weight: 800; font-size: 16px; }
.tool:disabled { opacity: .3; }
.dur { display: flex; align-items: center; gap: 6px; }
.pm { width: 48px; height: 48px; border-radius: 50%; background: color-mix(in srgb, var(--c) 22%, white); font: 800 28px/1 var(--display); box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 45%, white); }
.pm:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 45%, white); }
.mins { min-width: 64px; text-align: center; font: 800 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.mins small { display: block; font: 700 13px var(--body); color: var(--ink-soft); }
.bar { position: absolute; left: 0; bottom: 0; height: 8px; background: var(--c); border-radius: 0 8px 0 0; transition: width .25s; }

.buf { display: flex; align-items: center; gap: 8px; margin-left: 86px; padding: 8px 0 8px 22px; color: var(--ink-soft); font-weight: 700; font-size: 16px; border-left: 4px dotted #9DC3E0; margin-left: calc(86px + 34px); }

.goal { background: var(--sun); border-radius: 26px; padding: 26px 18px 18px; display: grid; grid-template-columns: 76px minmax(0,1fr) auto; gap: 14px; align-items: center; box-shadow: 0 6px 0 #E0A818; position: relative; overflow: hidden; }
.goal::before { content: ""; position: absolute; inset: 0 0 auto; height: 12px; background: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 12px 12px; opacity: .85; }
.gico { width: 76px; height: 76px; border-radius: 50%; background: var(--paper); font-size: 44px; display: grid; place-items: center; box-shadow: 0 4px 0 #E0A818; }
.glabel { font: 800 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: #6B5310; }
.gname { font: 800 26px/1.1 var(--display); overflow-wrap: anywhere; }
.gtime { display: flex; align-items: center; gap: 4px; background: var(--paper); border-radius: 20px; padding: 6px 10px; }
.tcol { display: flex; flex-direction: column; align-items: center; }
.tcol button { width: 52px; height: 34px; border-radius: 12px; font-size: 18px; color: var(--ink-soft); }
.tcol button:active { background: var(--sky); }
.tcol span { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.colon { font: 800 36px/1 var(--display); padding-bottom: 4px; }
.tomorrow { font: 700 13px var(--body); color: #6B5310; margin-top: 4px; }

/* Zusammenfassung */
.summary { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); background: var(--paper); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 var(--sky-deep); }
.sum-k { font: 800 14px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.bigtime { font: 800 76px/0.9 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sum-line { color: var(--ink-soft); font-weight: 700; }
.mini { display: flex; height: 18px; border-radius: 9px; overflow: hidden; background: var(--sky); }
.mini span { height: 100%; }
.late { background: #FFE9E3; color: #9A3412; border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 16px; }
.go { background: var(--go); color: var(--paper); border-radius: 22px; padding: 18px; font: 800 30px/1 var(--display); box-shadow: 0 6px 0 var(--go-dark); }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-dark); }
.go:disabled { opacity: .45; }
.tip { font-size: 15px; color: var(--ink-soft); }
.testflag { font: 800 13px var(--body); color: #7C3AED; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; background: rgba(30,42,71,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.sheet { background: var(--paper); border-radius: 30px; width: min(760px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
.sheet h2 { margin: 0; font: 800 30px/1.1 var(--display); text-wrap: balance; }
.sheet h3 { margin: 6px 0 0; font: 800 16px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.sheet-head { display: flex; align-items: center; gap: 12px; }
.sheet-head h2 { margin-right: auto; }
.x { width: 48px; height: 48px; border-radius: 50%; background: var(--sky); font-size: 22px; font-weight: 800; }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.lib button { background: var(--sky); border-radius: 22px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; line-height: 1.15; text-align: center; box-shadow: 0 4px 0 var(--sky-deep); }
.lib button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-deep); }
.lib b { font-size: 40px; line-height: 1; }
.lib em { font-style: normal; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
.custom { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--sky); border-radius: 22px; padding: 14px; }
.custom input { flex: 1 1 200px; min-width: 0; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; background: var(--paper); }
.emojis { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.emojis button { width: 46px; height: 46px; border-radius: 14px; font-size: 26px; background: var(--paper); }
.emojis button[aria-pressed="true"] { outline: 3px solid var(--ink); }
.ok { background: var(--go); color: var(--paper); border-radius: 16px; padding: 14px 20px; font-weight: 800; box-shadow: 0 4px 0 var(--go-dark); }
.setting { display: flex; align-items: center; gap: 14px; background: var(--sky); border-radius: 20px; padding: 14px 16px; }
.setting > div:first-child { margin-right: auto; }
.setting b { display: block; font-size: 18px; }
.setting span { font-size: 14px; color: var(--ink-soft); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--paper); font: 800 24px/1 var(--display); }
.stepper output { min-width: 56px; text-align: center; font: 800 22px var(--display); }
.toggle { width: 70px; height: 40px; border-radius: 20px; background: var(--snail); position: relative; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: var(--paper); transition: transform .2s; }
.toggle[aria-pressed="true"] { background: var(--go); }
.toggle[aria-pressed="true"]::after { transform: translateX(30px); }
.gate { display: flex; gap: 12px; flex-wrap: wrap; }
.gate button { flex: 1 1 100px; background: var(--sky); border-radius: 20px; padding: 18px; font: 800 30px var(--display); }
.tpl-list { display: flex; flex-direction: column; gap: 10px; }
.tpl { display: flex; align-items: center; gap: 14px; background: var(--sky); border-radius: 20px; padding: 12px 14px; }
.tpl > button:first-child { display: flex; align-items: center; gap: 14px; flex: 1; text-align: left; min-width: 0; }
.tpl b { font-size: 34px; }
.tpl strong { display: block; font: 800 20px/1.1 var(--display); }
.tpl span { font-size: 14px; color: var(--ink-soft); }

.setting { flex-wrap: wrap; }
.setting > div:first-child { flex: 1 1 220px; }
.ok.light { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 var(--sky-deep); }
.field { display: block; width: 100%; box-sizing: border-box; border: 3px solid var(--sky-deep); border-radius: 16px; padding: 14px; font-weight: 700; background: var(--paper); color: var(--ink); resize: vertical; }
.field.mono { font: 600 13px/1.4 ui-monospace, Menlo, monospace; }
.tabs { display: flex; gap: 6px; background: var(--sky); border-radius: 999px; padding: 5px; align-self: flex-start; }
.tabs button { border-radius: 999px; padding: 10px 22px; font-weight: 800; color: var(--ink-soft); }
.tabs button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 var(--sky-deep); }
.preview { display: flex; align-items: center; gap: 16px; background: var(--sky); border-radius: 22px; padding: 14px 18px; }
.preview span { width: 68px; height: 68px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 38px; flex: none; }
.preview strong { display: block; font: 800 24px/1.1 var(--display); overflow-wrap: anywhere; }
.preview em { font-style: normal; font-weight: 800; color: var(--ink-soft); }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
.emojis.big { gap: 8px; }
.emojis.big button { width: 52px; height: 52px; font-size: 30px; background: var(--sky); }
.emoji-in { width: 90px; border: 0; border-radius: 14px; padding: 8px; font-size: 28px; text-align: center; background: var(--paper); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 10px 10px 20px; display: flex; gap: 12px; align-items: center; font-weight: 700; z-index: 60; }
.toast button { background: var(--sun); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-weight: 800; }

/* ---------- Laufen ---------- */
.run { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--c) 16%, white); display: grid; grid-template-rows: auto minmax(0,1fr) auto auto; transition: background .6s;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.run-top { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.ghost { background: rgba(255,255,255,.7); border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: 15px; color: var(--ink-soft); }
.run-goal { margin-left: auto; background: var(--paper); border-radius: 999px; padding: 8px 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.run-goal b { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.run-clock { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 16px; }
.run-mid { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 5vw, 64px); min-height: 0; }
.disk-wrap { position: relative; width: min(52vmin, 470px); aspect-ratio: 1; max-width: 100%; flex: none; }
.disk { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 0 rgba(30,42,71,.08)); }
.disk-ico { position: absolute; inset: 0; display: grid; place-items: center; font-size: min(14vmin, 120px); pointer-events: none; }
.run-text { display: flex; flex-direction: column; gap: 10px; max-width: 460px; min-width: 0; }
.kicker { font: 800 16px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.run-text h1 { margin: 0; font: 800 clamp(40px, 6.4vmin, 68px)/1 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.left { font: 800 clamp(30px, 5vmin, 48px)/1 var(--display); font-variant-numeric: tabular-nums; color: var(--c-ink); }
.until { font-weight: 700; color: var(--ink-soft); font-size: 20px; }
.big-done { margin-top: 10px; align-self: flex-start; background: var(--go); color: var(--paper); border-radius: 26px; padding: 18px 34px; font: 800 34px/1 var(--display); box-shadow: 0 7px 0 var(--go-dark); }
.big-done:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--go-dark); }
.next-banner { justify-self: center; display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 999px; padding: 10px 26px 10px 12px; font: 800 24px/1.1 var(--display); box-shadow: 0 5px 0 rgba(30,42,71,.12); margin-block: 6px 10px; animation: pop .5s ease-out; }
.next-banner i { font-style: normal; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; background: var(--sun); font-size: 30px; }
.next-banner small { display: block; font: 700 14px var(--body); color: var(--ink-soft); }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }

.road { position: relative; height: 118px; margin-bottom: 14px; }
.asphalt { position: absolute; left: 0; right: 0; bottom: 18px; height: 34px; border-radius: 17px; background: var(--road); }
.asphalt::after { content: ""; position: absolute; left: 20px; right: 20px; top: 15px; height: 4px; background: repeating-linear-gradient(90deg, var(--sun) 0 18px, transparent 18px 34px); border-radius: 2px; }
.road-in { position: absolute; left: 34px; right: 54px; top: 0; bottom: 0; }
.station { position: absolute; bottom: 10px; transform: translateX(-50%); width: 50px; height: 50px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-size: 26px; border: 4px solid var(--st); transition: transform .3s; }
.station.done::after { content: "⭐"; position: absolute; top: -14px; right: -12px; font-size: 20px; }
.station.now { transform: translateX(-50%) scale(1.18); }
.goalflag { position: absolute; right: -44px; bottom: 6px; width: 62px; height: 62px; border-radius: 18px; background: var(--sun); display: grid; place-items: center; font-size: 32px; border: 4px solid var(--paper); }
.runner { position: absolute; bottom: 62px; transform: translateX(-50%); font-size: 40px; transition: left 1s linear; }

.party { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.party h1 { margin: 0; font: 800 clamp(56px, 10vmin, 110px)/1 var(--display); }
.party p { margin: 0; font-size: 24px; font-weight: 700; color: var(--ink-soft); }
.stars { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 44px; }
.stars span { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--paper); position: relative; }
.stars span::after { content: "⭐"; position: absolute; top: -8px; right: -8px; font-size: 24px; }
.confetti { position: fixed; top: -60px; font-size: 34px; pointer-events: none; z-index: 45; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

@media (max-width: 880px) {
  .plan { grid-template-columns: minmax(0,1fr); }
  .summary { position: sticky; top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); order: 2; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 16px 18px; gap: 10px 16px; box-shadow: 0 6px 24px rgba(30,42,71,.18); }
  .summary .bigtime { font-size: 52px; }
  .summary .tip, .summary .mini { display: none; }
  .summary .go { margin-left: auto; padding: 16px 24px; font-size: 26px; }
}
@media (max-width: 560px) {
  .row { grid-template-columns: 56px minmax(0,1fr); gap: 8px; }
  .when { font-size: 18px; }
  .add-before { margin-left: 64px; }
  .buf, .gap { margin-left: calc(64px + 30px); }
  .step { grid-template-columns: 48px minmax(0,1fr); }
  .ico { width: 48px; height: 48px; font-size: 28px; }
  .dur { grid-column: 1 / -1; justify-content: flex-end; }
  .goal { grid-template-columns: 56px minmax(0,1fr); }
  .gico { width: 56px; height: 56px; font-size: 32px; }
  .gtime { grid-column: 1 / -1; justify-self: end; }
  .logo { font-size: 24px; }
}
@media (orientation: portrait) and (max-width: 1000px) {
  .run-mid { flex-direction: column; text-align: center; gap: 24px; }
  .run-text { align-items: center; }
  .big-done { align-self: center; }
  .disk-wrap { width: min(62vmin, 470px); }
}
@media (max-height: 560px) and (orientation: landscape) { .road { height: 96px; } .disk-wrap { width: 44vmin; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .confetti { display: none; }
}
</style>

<div id="app">
  <div class="wrap">
    <header class="top">
      <div class="logo"><i aria-hidden="true">⏰</i> Los-geht's-Uhr</div>
      <button class="chip-btn" data-act="templates">📋 Pläne</button>
      <button class="chip-btn" data-act="settings" aria-label="Eltern-Einstellungen">⚙️ Eltern</button>
    </header>
    <main class="plan">
      <section class="track" id="track" aria-label="Etappen"></section>
      <aside class="summary" id="summary"></aside>
    </main>
  </div>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="run" class="run" hidden></div>

<script>
(function () {
  "use strict";
  const KEY = "losgehtsuhr.v1";
  const COLORS = ["#FF7A6B", "#3CC8A0", "#4A90E2", "#9B7BE8", "#FFA23C", "#F47CB4"];
  const INK = ["#B4382B", "#13805E", "#2361A8", "#6544B8", "#B5650B", "#B23A78"];
  const LIB = [
    ["🧹", "Zimmer aufräumen", 15], ["🚿", "Duschen", 15], ["🪥", "Zähne putzen", 3],
    ["👕", "Anziehen", 7], ["👟", "Schuhe & Jacke", 7], ["🎒", "Tasche packen", 5],
    ["🥣", "Frühstücken", 15], ["🚽", "Aufs Klo", 3], ["💇", "Haare kämmen", 3],
    ["💧", "Trinkflasche füllen", 2], ["🍎", "Pausenbrot einpacken", 3], ["🐶", "Tier füttern", 5],

  // Übernimmt gespeicherte Daten (oder eine eingefügte Sicherung); gibt false zurück, wenn sie nicht passen.
  function adopt(d) {

  /* ---------- Rückwärts rechnen ---------- */
  function goalMs() {

  function schedule(g) {

    $("#track").innerHTML = h;

  function renderSummary() {
    const g = goalMs(), ph = schedule(g);

    const lateMin = Math.ceil((now - first) / 60000);

  /* ---------- Modals ---------- */
  let addAt = 0, customEmoji = "⭐", undoFn = null, toastT = 0, resetArm = 0, F = null;

  function openAdd() {

       <p class="tip" style="margin:0">Fehlt eine Aufgabe? Eltern können sie unter ⚙️ Eltern → Aufgaben-Bibliothek dauerhaft anlegen.</p>

  function openTemplates() {

  const libList = (k) => (k === "goal" ? S.goals : S.lib);

  }
  function openLibForm() {

  // Aktualisiert Vorschau und Auswahl, ohne das Fenster neu aufzubauen (Scrollposition bleibt erhalten).
  function syncForm() {

  }
  const firstGlyph = (s) => {

  };
  function openBackup() {
    openModal(head("Sicherung") + `

  function undoable(msg, fn) { undoFn = fn; toast(msg, true); }
  function toast(msg, undo) {
    const t = $("#toast");

  }

  /* ---------- Aktionen ---------- */
  const nextColor = () => { const used = S.plan.steps.map((s) => s.c); for (let c = 0; c < COLORS.length; c++) if (!used.includes(c)) return c; return S.plan.steps.length % COLORS.length; };
  function changed() { save(); renderTrack(); }
  const A = {
    add: (d) => { addAt = +d.at; openAdd(); },
    pick: (d) => { const l = S.lib[+d.i]; S.plan.steps.splice(addAt, 0, mk(l.e, l.n, l.m, nextColor())); closeModal(); changed(); },

    custom: () => { const v = $("#cname").value.trim(); if (!v) { $("#cname").focus(); return; } S.plan.steps.splice(addAt, 0, mk(customEmoji, v, 5, nextColor())); closeModal(); changed(); },
    inc: (d) => { const s = S.plan.steps[+d.i]; s.m = Math.min(90, s.m < 10 ? s.m + 1 : s.m + 5); changed(); },
    dec: (d) => { const s = S.plan.steps[+d.i]; s.m = Math.max(1, s.m <= 10 ? s.m - 1 : s.m - 5); changed(); },
    up: (d) => { const i = +d.i, a = S.plan.steps; [a[i - 1], a[i]] = [a[i], a[i - 1]]; changed(); },
    down: (d) => { const i = +d.i, a = S.plan.steps; [a[i + 1], a[i]] = [a[i], a[i + 1]]; changed(); },

    undo: () => { if (undoFn) { undoFn(); undoFn = null; } $("#toast").hidden = true; },
    goalpick: openGoal,
    goalset: (d) => { const g = S.goals[+d.i]; S.plan.goal.e = g.e; S.plan.goal.n = g.n; closeModal(); changed(); },
    lib: (d) => openLib(d.k),
    libNew: (d) => { F = { k: d.k, i: -1, e: d.k === "goal" ? "🏁" : "⭐", n: "", m: 10 }; openLibForm(); setTimeout(() => $("#fname") && $("#fname").focus(), 50); },
    libEdit: (d) => { const x = libList(d.k)[+d.i]; F = { k: d.k, i: +d.i, e: x.e, n: x.n, m: x.m || 10 }; openLibForm(); },
    fe: (d) => { F.e = d.e; $("#femoji").value = ""; syncForm(); },
    "fm+": () => { F.m = Math.min(180, F.m < 10 ? F.m + 1 : F.m + 5); syncForm(); },
    "fm-": () => { F.m = Math.max(1, F.m <= 10 ? F.m - 1 : F.m - 5); syncForm(); },
    libSave: () => {
      const n = F.n.trim();
      if (!n) { $("#fname").focus(); toast("Bitte gib einen Namen ein."); return; }
      const x = F.k === "goal" ? { e: F.e, n } : { e: F.e, n, m: F.m }, list = libList(F.k);
      if (F.i < 0) list.unshift(x); else list[F.i] = x;
      save(); openLib(F.k); toast(`„${n}“ gespeichert`);
    },
    libDel: (d) => {
      const list = libList(d.k), i = +d.i, x = list.splice(i, 1)[0];
      save(); openLib(d.k);
      undoable(`„${x.n}“ gelöscht`, () => { list.splice(i, 0, x); save(); if (!$("#modal").hidden && $(".tabs")) openLib(d.k); });
    },
    libReset: (d) => {
      if (resetArm > Date.now()) {
        resetArm = 0;
        if (d.k === "goal") S.goals = defGoals(); else S.lib = defLib();
        save(); openLib(d.k); toast("Standard wiederhergestellt");
        return;
      }
      resetArm = Date.now() + 3000;
      const b = $("#resetBtn"); b.textContent = "Wirklich? Nochmal tippen";
      setTimeout(() => { if (b.isConnected) b.textContent = "Standard wiederherstellen"; }, 3000);
    },
    settingsBack: openSettings,
    backup: openBackup,
    bkCopy: () => {
      const t = $("#bk"), fallback = () => { t.focus(); t.select(); toast("Text ist markiert. Jetzt über „Kopieren“ kopieren."); };
      try { navigator.clipboard.writeText(t.value).then(() => toast("Kopiert"), fallback); } catch (e) { fallback(); }
    },
    bkLoad: () => {
      let ok = false;
      try { const o = JSON.parse($("#bkin").value); ok = adopt(o.data || o); } catch (e) {}
      if (!ok) { toast("Das ist keine gültige Sicherung. Bitte den ganzen Text einfügen."); return; }
      save(); closeModal(); renderTrack(); toast("Sicherung übernommen");
    },
    goalcustom: () => { const v = $("#gname").value.trim(); if (!v) { $("#gname").focus(); return; } S.plan.goal.e = "🏁"; S.plan.goal.n = v; closeModal(); changed(); },
    "h+": () => { S.plan.goal.t = (S.plan.goal.t + 60) % 1440; changed(); },
    "h-": () => { S.plan.goal.t = (S.plan.goal.t + 1380) % 1440; changed(); },
    "m+": () => { S.plan.goal.t = (S.plan.goal.t + 5) % 1440; changed(); },
    "m-": () => { S.plan.goal.t = (S.plan.goal.t + 1435) % 1440; changed(); },
    templates: openTemplates,
    tpl: (d) => { S.plan = fromTpl(TEMPLATES[+d.i]); closeModal(); changed(); },
    savedLoad: (d) => { const t = S.saved[+d.i]; S.plan = { goal: { ...t.goal }, steps: t.steps.map((s) => mk(s[0], s[1], s[2], s[3])) }; closeModal(); changed(); },
    savedDel: (d) => { S.saved.splice(+d.i, 1); save(); openTemplates(); },
    saveCurrent: () => { const v = $("#tname").value.trim() || S.plan.goal.n; S.saved.push({ title: v, goal: { ...S.plan.goal }, steps: S.plan.steps.map((s) => [s.e, s.n, s.m, s.c]) }); save(); openTemplates(); toast("Plan gespeichert"); },
    settings: openGate,
    gate: (d) => { if (+d.v === gateAnswer) openSettings(); else openGate(); },
    "buf+": () => { S.settings.buffer = Math.min(10, S.settings.buffer + 1); changed(); openSettings(); },
    "buf-": () => { S.settings.buffer = Math.max(0, S.settings.buffer - 1); changed(); openSettings(); },
    "warn+": () => { S.settings.warn = Math.min(5, S.settings.warn + 1); changed(); openSettings(); },
    "warn-": () => { S.settings.warn = Math.max(1, S.settings.warn - 1); changed(); openSettings(); },
    sound: () => { S.settings.sound = !S.settings.sound; changed(); openSettings(); },
    test: () => { S.settings.test = !S.settings.test; changed(); openSettings(); },
    close: closeModal,
    start: startRun,
    done: markDone,
    exit: exitRun,
    back: endRun
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && A[b.dataset.act]) A[b.dataset.act](b.dataset);
    else if (e.target.id === "modal") closeModal();
  });
  document.addEventListener("input", (e) => {
    if (!F) return;
    if (e.target.id === "fname") { F.n = e.target.value; syncForm(); }
    if (e.target.id === "femoji") { const g = firstGlyph(e.target.value); if (g) { F.e = g; syncForm(); } }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "fname") A.libSave();
    if (e.key === "Enter" && e.target.id === "cname") A.custom();
    if (e.key === "Enter" && e.target.id === "gname") A.goalcustom();
    if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  });

  /* ---------- Töne ---------- */
  let AC = null;
  function initAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.resume) AC.resume(); } catch (e) { AC = null; } }
  function chime(kind) {
    if (!S.settings.sound || !AC) return;
    const notes = { start: [523, 659, 784], warn: [880, 660], done: [659, 784, 1047], goal: [523, 659, 784, 1047, 1319] }[kind];
    const t0 = AC.currentTime;
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), at = t0 + i * 0.17;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at); g.gain.linearRampToValueAtTime(0.2, at + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.7);
      o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + 0.75);
    });
  }

  /* ---------- Laufen ---------- */
  let R = null, wake = null;
  const clock = () => (R && R.test ? R.v0 + (Date.now() - R.r0) * 12 : Date.now());
  const requestWake = () => { try { navigator.wakeLock && navigator.wakeLock.request("screen").then((w) => (wake = w)).catch(() => {}); } catch (e) {} };
  document.addEventListener("visibilitychange", () => { if (R && document.visibilityState === "visible") requestWake(); });

  function startRun() {
    initAudio();
    const g = goalMs(), ph = schedule(g);
    if (!ph.length) return;
    const now = Date.now();
    R = { g, ph, done: {}, key: "", warned: "", test: S.settings.test, r0: now, v0: now, exitArm: 0, timer: 0 };
    if (R.test && ph[0].start > now) R.v0 = ph[0].start - 4000;
    R.t0 = clock();
    const roadStart = ph[0].start, span = g - roadStart;
    const stations = ph.filter((p) => p.type === "task").map((p) =>
      `<div class="station" data-id="${p.s.id}" style="left:${((p.start - roadStart) / span) * 100}%;--st:${color(p.s)}">${esc(p.s.e)}</div>`).join("");
    const run = $("#run");
    run.innerHTML = `
      <div class="run-top">
        <button class="ghost" data-act="exit" id="exitBtn">✕ Beenden</button>
        <div class="run-goal">${esc(S.plan.goal.e)} ${esc(S.plan.goal.n)} um <b>${hm(g)}</b></div>
        <div class="run-clock" id="rclock" aria-label="Uhrzeit"></div>
      </div>
      <div class="run-mid" id="rmid">
        <div class="disk-wrap">
          <svg class="disk" viewBox="0 0 200 200" aria-hidden="true">
            <circle cx="100" cy="100" r="96" fill="#FFFFFF"/>
            <path id="wedge" fill="var(--c)"/>
            ${Array.from({ length: 12 }, (_, i) => { const a = (i / 12) * Math.PI * 2; return `<line x1="${100 + 88 * Math.sin(a)}" y1="${100 - 88 * Math.cos(a)}" x2="${100 + 96 * Math.sin(a)}" y2="${100 - 96 * Math.cos(a)}" stroke="#1E2A47" stroke-opacity=".25" stroke-width="2.5" stroke-linecap="round"/>`; }).join("")}
            <circle cx="100" cy="100" r="44" fill="#FFFFFF"/>
          </svg>
          <div class="disk-ico" id="rico"></div>
        </div>
        <div class="run-text">
          <div class="kicker" id="rkick"></div>
          <h1 id="rname"></h1>
          <div class="left" id="rleft"></div>
          <div class="until" id="runtil"></div>
          <button class="big-done" data-act="done" id="doneBtn">Fertig! ✓</button>
        </div>
      </div>
      <div id="rnext" class="next-banner" hidden></div>
      <div class="road" aria-hidden="true">
        <div class="asphalt"></div>
        <div class="road-in">${stations}<div class="goalflag">${esc(S.plan.goal.e)}</div><div class="runner" id="runner">🧒</div></div>
      </div>`;
    run.hidden = false;
    requestWake();
    tick();
    R.timer = setInterval(tick, 250);
  }

  // Welche Phase gerade dran ist, inklusive "Bonuszeit", wenn eine Aufgabe früher fertig wurde.
  function current(t) {
    const ph = R.ph;
    if (t >= R.g) return { kind: "goal" };
    if (t < ph[0].start) return { kind: "wait", start: R.t0, end: ph[0].start, next: ph[0].s, key: "wait" };
    const i = ph.findIndex((p) => t >= p.start && t < p.end);
    const p = ph[i];
    const nextTask = ph.slice(i + 1).find((q) => q.type === "task");
    const doneTask = p.type === "task" ? (R.done[p.s.id] ? p.s : null) : (ph[i - 1] && R.done[ph[i - 1].s.id] ? ph[i - 1].s : null);
    if (doneTask) return { kind: "bonus", start: R.done[doneTask.id], end: nextTask ? nextTask.start : R.g, next: nextTask && nextTask.s, key: "bonus" + doneTask.id };
    if (p.type === "task") return { kind: "task", s: p.s, start: p.start, end: p.end, next: nextTask && nextTask.s, key: "task" + p.s.id };
    return { kind: "buffer", start: p.start, end: p.end, next: nextTask && nextTask.s, key: "buf" + i };
  }

  function wedge(f) {
    if (f <= 0.001) return "";
    if (f >= 0.999) return "M100,4 A96,96 0 1,1 99.99,4 Z";
    const a = f * Math.PI * 2;
    return `M100,100 L100,4 A96,96 0 ${f > 0.5 ? 1 : 0},1 ${100 + 96 * Math.sin(a)},${100 - 96 * Math.cos(a)} Z`;
  }
  const leftText = (ms) => ms >= 60000 ? `noch ${Math.ceil(ms / 60000)} Min` : `noch ${Math.max(0, Math.ceil(ms / 1000))} Sek`;
  const nextLabel = (s) => s ? `${esc(s.e)} ${esc(s.n)}` : `${esc(S.plan.goal.e)} ${esc(S.plan.goal.n)}`;

  function tick() {
    if (!R) return;
    const t = clock(), c = current(t), run = $("#run");
    $("#rclock").textContent = hm(t);
    if (c.kind === "goal") return celebrate();

    if (c.key !== R.key) {
      const first = R.key === "";
      R.key = c.key;
      const col = c.kind === "task" ? color(c.s) : c.kind === "buffer" ? "#A9B9C9" : c.kind === "bonus" ? "#3CC8A0" : "#FFC93C";
      const ink = c.kind === "task" ? INK[c.s.c % INK.length] : c.kind === "bonus" ? "#13805E" : "#1E2A47";
      run.style.setProperty("--c", col); run.style.setProperty("--c-ink", ink);
      const T = {
        task: ["Jetzt dran", esc(c.s && c.s.n), c.s && esc(c.s.e), `bis ${hm(c.end)} Uhr`],
        buffer: ["Puffer-Zeit", "Mach in Ruhe fertig", "🐌", `Um ${hm(c.end)} startet: ${nextLabel(c.next)}`],
        bonus: ["Super gemacht!", c.next ? "Du hast Bonuszeit" : "Alles erledigt!", "⭐", `Um ${hm(c.end)}: ${nextLabel(c.next)}`],
        wait: ["Noch freie Zeit", "Gleich geht's los", "🎈", `Um ${hm(c.end)} startet: ${nextLabel(c.next)}`]
      }[c.kind];
      $("#rkick").textContent = T[0]; $("#rname").innerHTML = T[1]; $("#rico").innerHTML = T[2]; $("#runtil").innerHTML = T[3];
      $("#doneBtn").hidden = c.kind !== "task";
      if (c.kind === "task" && !first) chime("start");
      document.querySelectorAll(".station").forEach((el) => {
        el.classList.toggle("now", c.kind === "task" && el.dataset.id === c.s.id);
      });
    }
    // Sterne für erledigte oder vorbeigegangene Etappen
    R.ph.forEach((p) => { if (p.type === "task") { const el = document.querySelector(`.station[data-id="${p.s.id}"]`); if (el) el.classList.toggle("done", !!R.done[p.s.id] || t >= p.end); } });

    const remain = c.end - t, frac = Math.max(0, Math.min(1, remain / Math.max(1, c.end - c.start)));
    $("#wedge").setAttribute("d", wedge(frac));
    $("#rleft").textContent = leftText(remain);

    // Vorwarnung: Ton + Vorschau der nächsten Aufgabe; im Puffer immer sichtbar
    const warnMs = S.settings.warn * 60000;
    const showNext = c.kind === "buffer" || (c.kind === "task" && remain <= warnMs);
    const nb = $("#rnext");
    if (showNext) {
      const html = `<i>${c.next ? esc(c.next.e) : esc(S.plan.goal.e)}</i><div><small>Gleich kommt</small>${c.next ? esc(c.next.n) : esc(S.plan.goal.n)}</div>`;
      if (nb.hidden || nb.dataset.k !== c.key) { nb.innerHTML = html; nb.dataset.k = c.key; nb.hidden = false; }
      if (c.kind === "task" && R.warned !== c.key) { R.warned = c.key; chime("warn"); }
    } else nb.hidden = true;

    const span = R.g - R.ph[0].start, prog = Math.max(0, Math.min(1, (t - R.ph[0].start) / span));
    $("#runner").style.left = prog * 100 + "%";
  }

  function markDone() {
    if (!R) return;
    const c = current(clock());
    if (c.kind !== "task") return;
    R.done[c.s.id] = clock();
    chime("done");
    burst(10);
    tick();
  }

  function celebrate() {
    clearInterval(R.timer);
    chime("goal");
    $("#run").style.setProperty("--c", "#FFC93C");
    $("#rnext").hidden = true;
    $("#rmid").innerHTML = `<div class="party">
      <div style="font-size:min(20vmin,150px)">${esc(S.plan.goal.e)}</div>
      <h1>Geschafft!</h1>
      <p>${esc(S.plan.goal.n)}, genau rechtzeitig um ${hm(R.g)} Uhr.</p>
      <div class="stars">${S.plan.steps.map((s) => `<span>${esc(s.e)}</span>`).join("")}</div>
      <button class="go" data-act="back" style="margin-top:8px">Zurück zum Plan</button></div>`;
    document.querySelectorAll(".station").forEach((el) => el.classList.add("done"));
    $("#runner").style.left = "100%";
    burst(40);
  }
  function burst(n) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const set = ["⭐", "🎉", "✨", "🌟", "🎈"];
    for (let i = 0; i < n; i++) {
      const s = document.createElement("span");
      s.className = "confetti"; s.textContent = set[i % set.length];
      s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 2 + Math.random() * 2 + "s"; s.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
    }
  }
  function exitRun() {
    const b = $("#exitBtn");
    if (R && R.exitArm > Date.now()) return endRun();
    if (R) R.exitArm = Date.now() + 3000;
    b.textContent = "Nochmal tippen zum Beenden";
    setTimeout(() => { if (b.isConnected) b.textContent = "✕ Beenden"; }, 3000);
  }
  function endRun() {
    if (R) clearInterval(R.timer);
    R = null;
    try { wake && wake.release(); } catch (e) {}
    $("#run").hidden = true; $("#run").innerHTML = "";
    renderTrack();
  }

  renderTrack();
  setInterval(() => { if (!R && $("#modal").hidden) renderSummary(); }, 20000);
})();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
</body>
</html>
